<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>越南在地生活實用語小測驗 - 南越版本（胡志明）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container-mobile {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }
        
        .btn-candy {
            position: relative;
            font-size: 18px;
            font-weight: bold;
            padding: 16px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15), 0 0 0 rgba(0, 0, 0, 0.1) inset;
        }
        
        .btn-candy:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15), 0 0 0 rgba(0, 0, 0, 0.1) inset;
        }
        
        .btn-pink { background: linear-gradient(135deg, #ff6b9d 0%, #ff4757 100%); color: white; }
        .btn-blue { background: linear-gradient(135deg, #54a0ff 0%, #48dbfb 100%); color: white; }
        .btn-green { background: linear-gradient(135deg, #26de81 0%, #20c997 100%); color: white; }
        .btn-yellow { background: linear-gradient(135deg, #ffa502 0%, #ff9f43 100%); color: white; }
        .btn-purple { background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%); color: white; }
        
        .option-btn {
            min-height: 80px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.4;
            word-wrap: break-word;
            white-space: normal;
        }
        
        .option-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .option-btn.correct {
            animation: correctPulse 0.6s ease-out;
        }
        
        .option-btn.incorrect {
            animation: shake 0.4s ease-out;
        }
        
        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        
        @keyframes starPop {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) rotate(360deg); opacity: 0; }
        }
        
        .star-popup {
            position: fixed;
            font-size: 40px;
            animation: starPop 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 1000;
        }
        
        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            animation: confettiFall 3s ease-in forwards;
        }
        
        @keyframes confettiFall {
            to {
                transform: translateY(800px) rotateZ(360deg);
                opacity: 0;
            }
        }
        
        .pronunciation-hint {
            background: #f0f4ff;
            padding: 12px;
            border-left: 4px solid #6c5ce7;
            border-radius: 6px;
            font-size: 14px;
            color: #2d3436;
            margin: 12px 0;
            line-height: 1.6;
        }
        
        .scene-tag {
            display: inline-block;
            background: #dfe6e9;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            margin: 4px 4px 4px 0;
            color: #2d3436;
        }
        
        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }
        
        .alphabet-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 16px 0;
        }
        
        .alphabet-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s;
        }
        
        .alphabet-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .alphabet-btn:active {
            transform: scale(0.95);
        }
        
        .tone-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
            border-left: 4px solid #667eea;
        }
        
        .tone-label {
            font-weight: bold;
            color: #2d3436;
            font-size: 14px;
        }
        
        .tone-example {
            font-size: 20px;
            color: #667eea;
            margin: 6px 0;
            font-weight: bold;
        }
        
        .accordion-item {
            border-bottom: 1px solid #e0e0e0;
            margin: 8px 0;
        }
        
        .accordion-header {
            padding: 14px;
            background: #f8f9fa;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 6px;
            transition: background 0.2s;
        }
        
        .accordion-header:hover {
            background: #ecf0f1;
        }
        
        .accordion-content {
            padding: 12px 14px;
            display: none;
            background: white;
        }
        
        .accordion-content.active {
            display: block;
        }
        
        .sentence-item {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            margin: 8px 0;
            border-left: 4px solid #667eea;
        }
        
        .sentence-text {
            font-size: 16px;
            font-weight: bold;
            margin: 6px 0;
            color: #2d3436;
        }
        
        .sentence-translation {
            font-size: 14px;
            color: #636e72;
            margin: 4px 0;
        }
        
        .sentence-hint {
            font-size: 13px;
            color: #b2bec3;
            margin: 4px 0;
            font-style: italic;
        }
        
        .play-btn-small {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .play-btn-small:active {
            transform: scale(0.95);
            background: #5f6ac0;
        }
        
        .score-number {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
        }
        
        .encouragement {
            font-size: 20px;
            font-weight: bold;
            color: #2d3436;
            margin: 16px 0;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .back-btn {
            background: #dfe6e9;
            color: #2d3436;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin: 8px;
        }
    </style>
</head>
<body>
    <div class="container-mobile" id="app">
        <!-- 首頁 -->
        <div id="startPage" class="flex flex-col items-center justify-center flex-1 p-6 bg-gradient-to-b from-pink-50 to-blue-50">
            <div class="text-center">
                <div class="text-5xl mb-4">🇻🇳</div>
                <h1 class="text-3xl font-bold text-gray-800 mb-2">越南在地生活</h1>
                <h2 class="text-2xl font-bold text-purple-600 mb-2">實用語小測驗</h2>
                <p class="text-sm text-orange-600 font-bold mb-2">🗺️ 南越版本（胡志明口音）</p>
                <p class="text-gray-600 text-xs mb-8 leading-relaxed">1000+ 句常用生活語<br>字母發音學習<br>適合在南越生活/工作</p>
                
                <button id="quizBtn" class="btn-candy btn-pink w-40 py-4 text-xl mb-3">開始測驗 🎲</button>
                <button id="alphabetBtn" class="btn-candy btn-blue w-40 py-4 text-xl">字母發音 🔤</button>
                <p class="text-xs text-gray-500 mt-6">提示：確保音量已開啟以體驗發音功能</p>
            </div>
        </div>
        
        <!-- 字母發音頁面 -->
        <div id="alphabetPage" class="hidden flex flex-col h-full bg-white overflow-hidden">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800">🔤 越南字母發音</h2>
                <button id="backFromAlphabet" class="back-btn">← 回首頁</button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4">
                <!-- 字母表選項卡 -->
                <div class="flex gap-2 mb-4 overflow-x-auto pb-2">
                    <button id="tabBasic" class="btn-candy btn-blue text-sm py-2 px-3 flex-shrink-0">基本字母</button>
                    <button id="tabTones" class="btn-candy btn-blue text-sm py-2 px-3 flex-shrink-0">聲調符號</button>
                    <button id="tabCombos" class="btn-candy btn-blue text-sm py-2 px-3 flex-shrink-0">字母組合</button>
                    <button id="tabQuiz" class="btn-candy btn-green text-sm py-2 px-3 flex-shrink-0">辨音測驗</button>
                </div>
                
                <!-- 基本字母 -->
                <div id="contentBasic">
                    <h3 class="font-bold text-lg mb-3 text-gray-800">29 個基本字母</h3>
                    <div class="alphabet-grid" id="alphabetGrid"></div>
                </div>
                
                <!-- 聲調符號 -->
                <div id="contentTones" class="hidden">
                    <h3 class="font-bold text-lg mb-3 text-gray-800">6 個聲調符號</h3>
                    <div id="tonesContainer"></div>
                </div>
                
                <!-- 字母組合 -->
                <div id="contentCombos" class="hidden">
                    <h3 class="font-bold text-lg mb-3 text-gray-800">常見字母組合</h3>
                    <div id="combosContainer"></div>
                </div>
                
                <!-- 辨音測驗 -->
                <div id="contentQuiz" class="hidden">
                    <h3 class="font-bold text-lg mb-3 text-gray-800">字母辨音測驗</h3>
                    <div id="quizContainer"></div>
                </div>
            </div>
        </div>
        
        <!-- 場景選擇頁面 -->
        <div id="scenePage" class="hidden flex flex-col h-full bg-white overflow-hidden">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-800">選擇學習場景</h2>
                <button id="backFromScene" class="back-btn">← 回首頁</button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4">
                <div id="sceneButtons" class="flex flex-wrap gap-2 justify-center"></div>
                <button id="startBtn" class="btn-candy btn-pink w-full py-3 text-xl mt-8">開始測驗</button>
            </div>
        </div>
        
        <!-- 測驗頁面 -->
        <div id="quizPage" class="hidden flex flex-col h-full bg-white overflow-hidden">
            <div class="p-4 border-b border-gray-200">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-bold text-gray-700">第 <span id="currentQuestion">1</span> / 20 題</span>
                    <span class="text-sm font-bold text-purple-600">⭐ <span id="starCount">0</span> 星</span>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill" style="width: 0%"></div>
                </div>
                <div class="flex justify-between items-center mt-2 text-xs">
                    <span class="scene-tag" id="sceneTag"></span>
                    <button id="questionMode" class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold cursor-pointer">
                        看越文選中文 🔄
                    </button>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 flex flex-col justify-between">
                <div>
                    <div class="text-center mb-4 text-sm font-bold text-gray-600">
                        <span id="modeLabel"></span>
                    </div>
                    
                    <div class="bg-gradient-to-r from-purple-100 to-blue-100 p-6 rounded-2xl mb-4 text-center">
                        <div id="questionText" class="text-2xl font-bold text-gray-800 mb-2 leading-relaxed break-words"></div>
                        <button id="playBtn" class="btn-candy btn-blue py-2 px-4 text-lg inline-block">
                            🔊 聽發音
                        </button>
                    </div>
                    
                    <div id="pronunciationHint" class="pronunciation-hint hidden"></div>
                </div>
                
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <button id="option0" class="option-btn btn-candy btn-pink"></button>
                    <button id="option1" class="option-btn btn-candy btn-blue"></button>
                    <button id="option2" class="option-btn btn-candy btn-green"></button>
                    <button id="option3" class="option-btn btn-candy btn-yellow"></button>
                </div>
            </div>
        </div>
        
        <!-- 結算頁面 -->
        <div id="resultsPage" class="hidden flex flex-col items-center justify-start flex-1 p-6 bg-gradient-to-b from-yellow-50 to-pink-50 overflow-y-auto">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">🎉 本輪測驗結束</h2>
            
            <div class="bg-white rounded-2xl shadow-lg p-8 text-center mb-6 w-full">
                <div class="text-sm text-gray-600 mb-2">總分</div>
                <div class="score-number mb-4"><span id="finalScore">0</span> / 20</div>
                
                <div class="text-sm text-gray-600 mb-2">累積星星</div>
                <div class="text-4xl mb-4">⭐ <span id="finalStars">0</span></div>
                
                <div id="encouragementMsg" class="encouragement"></div>
            </div>
            
            <div class="w-full mb-6">
                <h3 class="text-lg font-bold text-gray-800 mb-3">📖 本輪 20 句生活手冊</h3>
                <div id="handbookContainer"></div>
            </div>
            
            <div class="flex gap-3 mt-6 w-full">
                <button id="reviewBtn" class="btn-candy btn-green flex-1 py-3">📖 複習本輪</button>
                <button id="restartBtn" class="btn-candy btn-pink flex-1 py-3">🔄 再來一次</button>
            </div>
        </div>
    </div>
 
    <script>
        // ============ 越南字母數據 ============
        const vietnameseAlphabet = [
            { letter: 'A', name: 'A', example: 'ăn (吃)', hint: 'A 音如「啊」' },
            { letter: 'Ă', name: 'A breve', example: 'ấn (壓)', hint: '短元音' },
            { letter: 'Â', name: 'A circumflex', example: 'âm (陰)', hint: '短元音變' },
            { letter: 'B', name: 'Be', example: 'ba (爸)', hint: '雙唇音' },
            { letter: 'C', name: 'Ce', example: 'ca (唱)', hint: '硬音/K音' },
            { letter: 'D', name: 'De', example: 'da (是)', hint: '南越濁音/Z音' },
            { letter: 'Đ', name: 'D stroke', example: 'đi (去)', hint: '獨特越南字母' },
            { letter: 'E', name: 'E', example: 'em (妹)', hint: '開口音' },
            { letter: 'Ê', name: 'E circumflex', example: 'ếu (弱)', hint: '短E音' },
            { letter: 'G', name: 'G', example: 'gà (雞)', hint: '軟G音' },
            { letter: 'H', name: 'H', example: 'hà (河)', hint: '呼吸音' },
            { letter: 'I', name: 'I', example: 'ì (怕)', hint: '高音元音' },
            { letter: 'K', name: 'K', example: 'ka (歌)', hint: '硬音/C音' },
            { letter: 'L', name: 'L', example: 'la (拿)', hint: '舌尖音' },
            { letter: 'M', name: 'M', example: 'ma (幽靈)', hint: '唇鼻音' },
            { letter: 'N', name: 'N', example: 'na (呢)', hint: '舌尖鼻音' },
            { letter: 'O', name: 'O', example: 'ó (升)', hint: '圓唇音' },
            { letter: 'Ô', name: 'O circumflex', example: 'ôi (哎)', hint: '短O音' },
            { letter: 'Ơ', name: 'O horn', example: 'ơi (喂)', hint: '開圓唇音' },
            { letter: 'P', name: 'P', example: 'pa (怕)', hint: '清唇音' },
            { letter: 'Q', name: 'Q', example: 'qu (去/屈)', hint: 'QU 組合' },
            { letter: 'R', name: 'R', example: 'ra (撒)', hint: '舌音' },
            { letter: 'S', name: 'S', example: 'sa (沙)', hint: '清齒音' },
            { letter: 'T', name: 'T', example: 'ta (他)', hint: '清舌尖音' },
            { letter: 'U', name: 'U', example: 'um (嗯)', hint: '唇高音' },
            { letter: 'Ư', name: 'U horn', example: 'ưa (喜)', hint: '圓唇高音' },
            { letter: 'V', name: 'V', example: 'va (與)', hint: '摩擦音' },
            { letter: 'X', name: 'X', example: 'xa (遠)', hint: 'X 音如「沙」' },
            { letter: 'Y', name: 'Y', example: 'yêu (愛)', hint: '半元音' }
        ];
        
        const tones = [
            { tone: '無符號', mark: 'a', example: 'ma', meaning: '幽靈', desc: '平聲 - 中平調' },
            { tone: '有尖 ´', mark: 'á', example: 'má', meaning: '媽媽', desc: '上聲 - 向上調' },
            { tone: '有問 ̉', mark: 'ả', example: 'mả', meaning: '墓', desc: '類問 - 下降後上升' },
            { tone: '有波 ~', mark: 'ã', example: 'mã', meaning: '馬', desc: '鼻化 - 帶鼻音中調' },
            { tone: '有點 ̣', mark: 'ạ', example: 'mạ', meaning: '芽', desc: '重聲 - 低降調' },
            { tone: '有鉤ˀ', mark: 'ă', example: 'mă', meaning: 'N/A', desc: '短促 - 短暫停頓' }
        ];
        
        const letterCombos = [
            { combo: 'TH', desc: '濁音 /ð/', examples: 'tha (鋪), the (放), thi (考)', hint: '南越常用' },
            { combo: 'CH', desc: '清音 /tʃ/', examples: 'cha (茶), che (等待)', hint: '像英文 CH' },
            { combo: 'NH', desc: '鼻音 /ɲ/', examples: 'nha (家), nhỏ (小)', hint: '帶鼻韻' },
            { combo: 'NG', desc: '後鼻音 /ŋ/', examples: 'ng...ngon (好吃)', hint: '詞尾常見' },
            { combo: 'GH', desc: '半音 /w/', examples: 'ghi (回憶)', hint: '半元音開頭' },
            { combo: 'QU', desc: 'QU組合 /kw/', examples: 'qua (通過), que (遺忘)', hint: 'Q 後必跟 U' },
            { combo: 'PH', desc: '清音 /f/', examples: 'pha (能), pho (河粉)', hint: '像英文 PH' },
            { combo: 'TR', desc: '卷舌音 /tʃ/', examples: 'tra (茶)', hint: '南越發音' },
            { combo: 'GI', desc: '軟音 /z/', examples: 'gia (家), gì (什麼)', hint: '南越發音' }
        ];
        
        // ============ 題庫數據（1000+ 句）============
        const questionBank = [
            // 1. 常用問候 (80句)
            { scene: '常用問候', vi: 'Xin chào', zh: '你好', hint: 'Sin chào' },
            { scene: '常用問候', vi: 'Chào anh/chị sáng', zh: '早上好', hint: 'Chào anh/chị sáng' },
            { scene: '常用問候', vi: 'Bạn khỏe không ạ?', zh: '你好嗎？', hint: 'Ban khỏe không' },
            { scene: '常用問候', vi: 'Tôi khỏe, cảm ơn anh/chị', zh: '我很好，謝謝', hint: '南部習慣加敬語' },
            { scene: '常用問候', vi: 'Tên em là...', zh: '我叫...', hint: '南部年輕人常用em自稱' },
            { scene: '常用問候', vi: 'Rất vui gặp anh/chị', zh: '很高興認識你', hint: '南部常說gặp anh/chị' },
            { scene: '常用問候', vi: 'Anh/Chị từ đâu vậy?', zh: '你來自哪裡？', hint: '南部加疑問詞vậy' },
            { scene: '常用問候', vi: 'Em từ Đài Loan', zh: '我來自台灣', hint: '南部自稱em' },
            { scene: '常用問候', vi: 'Anh/Chị làm gì ạ?', zh: '你做什麼工作？', hint: '南部常加敬詞ạ' },
            { scene: '常用問候', vi: 'Em là kỹ sư', zh: '我是工程師', hint: '南部年輕人用em自稱' },
            { scene: '常用問候', vi: 'Anh/Chị bao nhiêu tuổi vậy?', zh: '你多少歲？', hint: '南部說法較隨意' },
            { scene: '常用問候', vi: 'Em 30 tuổi', zh: '我 30 歲', hint: '南部常用em自稱' },
            { scene: '常用問候', vi: 'Hôm nay nóng thế', zh: '今天天氣很熱', hint: '南越常說nóng(熱)' },

        // ============ 工具函數 ============
        function speakVietnamese(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'vi-VN';
                utterance.rate = 0.9;
                utterance.pitch = 1;
                utterance.volume = 1;
                window.speechSynthesis.speak(utterance);
            }
        }
 
        function playSound(type) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (type === 'correct') {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            }
        }

            appState.currentPage = page;
        }

                    <div class="text-sm text-gray-600">${combo.desc}</div>
                    <div class="text-xs text-gray-500">例字：${combo.examples}</div>
                    <div class="text-xs text-gray-400">提示：${combo.hint}</div>
                    <button class="play-btn-small mt-2" onclick="speakVietnamese('${combo.examples}')">🔊 聽發音</button>
                `;
                combosContainer.appendChild(box);
            });
 
            // 初始化標籤切換
            document.getElementById('tabBasic').onclick = () => switchTab('Basic');
            document.getElementById('tabTones').onclick = () => switchTab('Tones');
            document.getElementById('tabCombos').onclick = () => switchTab('Combos');
            document.getElementById('tabQuiz').onclick = () => initializeAlphabetQuiz();
        }
 
        function switchTab(tab) {
            document.querySelectorAll('[id^="content"]').forEach(el => el.classList.add('hidden'));
            document.getElementById('content' + tab).classList.remove('hidden');
        }
 
        function initializeAlphabetQuiz() {
            switchTab('Quiz');
            appState.alphabetQuizIndex = 0;
            appState.alphabetQuizScore = 0;
            showAlphabetQuizQuestion();
        }
 
        function showAlphabetQuizQuestion() {
            const quizContainer = document.getElementById('quizContainer');
            
            if (appState.alphabetQuizIndex >= 10) {
                quizContainer.innerHTML = `
                    <div class="text-center p-8">
                        <div class="text-4xl font-bold text-purple-600 mb-4">${appState.alphabetQuizScore}/10</div>
                        <div class="text-xl font-bold text-gray-800 mb-6">測驗完成！</div>
                        <button onclick="appState.alphabetQuizIndex = 0; appState.alphabetQuizScore = 0; initializeAlphabetQuiz();" class="btn-candy btn-green py-2 px-4">再試一次</button>
                    </div>
                `;
                return;
            }
 
            const randomLetter = vietnameseAlphabet[Math.floor(Math.random() * vietnameseAlphabet.length)];
            const wrongLetters = vietnameseAlphabet.filter(l => l.letter !== randomLetter.letter).sort(() => Math.random() - 0.5).slice(0, 3);
            const options = [randomLetter, ...wrongLetters].sort(() => Math.random() - 0.5);
 
            quizContainer.innerHTML = `
                <div class="text-center mb-6">
                    <div class="text-sm text-gray-600 mb-2">第 ${appState.alphabetQuizIndex + 1} / 10 題</div>
                    <div class="text-3xl font-bold mb-4 bg-gradient-to-r from-purple-100 to-blue-100 p-4 rounded-lg">
                        ${randomLetter.example}
                    </div>
                    <div class="text-sm text-gray-600">選擇正確的字母</div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    ${options.map((opt, idx) => `
                        <button onclick="checkAlphabetAnswer('${opt.letter}', '${randomLetter.letter}')" class="btn-candy btn-blue py-4 text-xl">
                            ${opt.letter}
                        </button>
                    `).join('')}
                </div>
            `;
        }
 
        function checkAlphabetAnswer(selected, correct) {
            if (selected === correct) {
                appState.alphabetQuizScore++;
                playSound('correct');
            }
            appState.alphabetQuizIndex++;
            setTimeout(() => showAlphabetQuizQuestion(), 500);
        }
 
        // ============ 測驗功能 ============
        function initializeSceneButtons() {
            const sceneButtons = document.getElementById('sceneButtons');
            const scenes = [...new Set(fullQuestionBank.map(q => q.scene))];
            
            sceneButtons.innerHTML = '<button id="sceneAllBtn" class="btn-candy btn-purple" data-scene="all">全部隨機 🎲</button>';
            
            scenes.forEach(scene => {
                const btn = document.createElement('button');
                btn.className = 'btn-candy btn-blue text-sm py-2 px-3';
                btn.textContent = scene;
                btn.dataset.scene = scene;
                btn.onclick = () => selectScene(scene);
                sceneButtons.appendChild(btn);
            });
            
            document.getElementById('sceneAllBtn').onclick = () => selectScene('all');
        }
 
        function selectScene(scene) {
            appState.currentScene = scene;
            document.querySelectorAll('#sceneButtons button').forEach(btn => {
                btn.style.opacity = btn.dataset.scene === scene ? '1' : '0.5';
            });
        }
 
        function startQuiz() {
            let availableQuestions = fullQuestionBank;
            if (appState.currentScene !== 'all') {
                availableQuestions = fullQuestionBank.filter(q => q.scene === appState.currentScene);
            }
            
            appState.questions = [];
            for (let i = 0; i < 20; i++) {
                const randomQ = availableQuestions[Math.floor(Math.random() * availableQuestions.length)];
                appState.questions.push(randomQ);
            }
            
            appState.sessionQuestions = [...appState.questions];
            appState.currentQuestionIndex = 0;
            appState.stars = 0;
            appState.score = 0;
            appState.isAnswered = false;
            appState.mode = Math.random() > 0.5 ? 'vi2zh' : 'zh2vi';
            
            showPage('quiz');
            displayQuestion();
        }
 
        function displayQuestion() {
            if (appState.currentQuestionIndex >= 20) {
                showResults();
                return;
            }
            
            const q = appState.questions[appState.currentQuestionIndex];
            appState.isAnswered = false;
            
            if (appState.currentQuestionIndex > 0 && Math.random() > 0.6) {
                appState.mode = appState.mode === 'vi2zh' ? 'zh2vi' : 'vi2zh';
            }
            
            document.getElementById('currentQuestion').textContent = appState.currentQuestionIndex + 1;
            document.getElementById('sceneTag').textContent = q.scene;
            document.getElementById('progressFill').style.width = ((appState.currentQuestionIndex + 1) / 20 * 100) + '%';
            
            const questionText = appState.mode === 'vi2zh' ? q.vi : q.zh;
            document.getElementById('questionText').textContent = questionText;
            document.getElementById('modeLabel').textContent = appState.mode === 'vi2zh' ? '看越文選中文' : '看中文選越南文';
            
            if (appState.mode === 'vi2zh') {
                document.getElementById('pronunciationHint').innerHTML = `<strong>發音提示：</strong>${q.hint}`;
                document.getElementById('pronunciationHint').classList.remove('hidden');
            } else {
                document.getElementById('pronunciationHint').classList.add('hidden');
            }
            
            const answer = appState.mode === 'vi2zh' ? q.zh : q.vi;
            const wrongAnswers = getWrongAnswers(answer, appState.mode);
            const options = [answer, ...wrongAnswers].sort(() => Math.random() - 0.5);
            
            const optionButtons = document.querySelectorAll('.option-btn');
            optionButtons.forEach((btn, idx) => {
                btn.textContent = options[idx];
                btn.dataset.answer = options[idx];
                btn.dataset.isCorrect = options[idx] === answer;
                btn.classList.remove('correct', 'incorrect', 'disabled');
                btn.onclick = () => selectAnswer(btn);
            });
        }
 
        function getWrongAnswers(correctAnswer, mode) {
            const allAnswers = mode === 'vi2zh' ? fullQuestionBank.map(q => q.zh) : fullQuestionBank.map(q => q.vi);
            const wrong = allAnswers.filter(a => a !== correctAnswer);
            const selected = [];
            for (let i = 0; i < 3; i++) {
                selected.push(wrong[Math.floor(Math.random() * wrong.length)]);
            }
            return selected;
        }
 
        function selectAnswer(btn) {
            if (appState.isAnswered) return;
            appState.isAnswered = true;
            
            const isCorrect = btn.dataset.isCorrect === 'true';
            
            document.querySelectorAll('.option-btn').forEach(b => {
                b.classList.add('disabled');
                if (b.dataset.isCorrect === 'true') {
                    b.classList.add('correct');
                } else if (b === btn && !isCorrect) {
                    b.classList.add('incorrect');
                }
            });
            
            if (isCorrect) {
                appState.score++;
                appState.stars++;
                playSound('correct');
                document.getElementById('starCount').textContent = appState.stars;
            }
            
            setTimeout(() => {
                appState.currentQuestionIndex++;
                displayQuestion();
            }, 1500);
        }
 
        function showResults() {
            let encouragement = '';
            if (appState.score === 20) {
                encouragement = '🏆 完美分數！你是越南語高手！';
            } else if (appState.score >= 16) {
                encouragement = '⭐ 太棒了！再練幾次就完全掌握！';
            } else if (appState.score >= 12) {
                encouragement = '👍 不錯！繼續努力加油！';
            } else if (appState.score >= 8) {
                encouragement = '💪 有進步！多練習就會更好！';
            } else {
                encouragement = '🌟 不怕！每一次都在進步！';
            }
            
            document.getElementById('finalScore').textContent = appState.score;
            document.getElementById('finalStars').textContent = appState.stars;
            document.getElementById('encouragementMsg').textContent = encouragement;
            
            generateHandbook();
            showPage('results');
        }
 
        function generateHandbook() {
            const container = document.getElementById('handbookContainer');
            container.innerHTML = '';
            
            const scenes = [...new Set(appState.sessionQuestions.map(q => q.scene))];
            
            scenes.forEach(scene => {
                const items = appState.sessionQuestions.filter(q => q.scene === scene);
                const accordion = document.createElement('div');
                accordion.className = 'accordion-item';
                
                const header = document.createElement('div');
                header.className = 'accordion-header';
                header.innerHTML = `<span><strong>${scene}</strong> (${items.length} 句)</span><span>▼</span>`;
                
                const content = document.createElement('div');
                content.className = 'accordion-content';
                
                items.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'sentence-item';
                    itemDiv.innerHTML = `
                        <div class="sentence-text">${item.vi}</div>
                        <div class="sentence-translation">📌 ${item.zh}</div>
                        <div class="sentence-hint">🎤 ${item.hint}</div>
                        <button class="play-btn-small" onclick="speakVietnamese('${item.vi}')">🔊 播放發音</button>
                    `;
                    content.appendChild(itemDiv);
                });
                
                header.onclick = () => {
                    content.classList.toggle('active');
                    header.style.background = content.classList.contains('active') ? '#e8eaf6' : '#f8f9fa';
                };
                
                accordion.appendChild(header);
                accordion.appendChild(content);
                container.appendChild(accordion);
            });
        }
 
        // ============ 事件監聽 ============
        document.getElementById('quizBtn').onclick = () => {
            initializeSceneButtons();
            showPage('scene');
        };
 
        document.getElementById('alphabetBtn').onclick = () => {
            initializeAlphabetPage();
            showPage('alphabet');
        };
 
        document.getElementById('startBtn').onclick = startQuiz;
        document.getElementById('playBtn').onclick = () => {
            const q = appState.questions[appState.currentQuestionIndex];
            speakVietnamese(appState.mode === 'vi2zh' ? q.vi : q.zh);
        };
 
        document.getElementById('questionMode').onclick = () => {
            appState.mode = appState.mode === 'vi2zh' ? 'zh2vi' : 'vi2zh';
            displayQuestion();
        };
 
        document.getElementById('restartBtn').onclick = () => showPage('start');
        document.getElementById('reviewBtn').onclick = () => showPage('start');
        document.getElementById('backFromAlphabet').onclick = () => showPage('start');
        document.getElementById('backFromScene').onclick = () => showPage('start');
 
        // 初始化
        showPage('start');
    </script>
</body>
</html>
