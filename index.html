<html lang="zh-TW">
<head>

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container-mobile {
            max-width: 500px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }
        
        .btn-candy {
            position: relative;
            font-size: 18px;
            font-weight: bold;
            padding: 16px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15), 0 0 0 rgba(0, 0, 0, 0.1) inset;
            active: all 0.05s;
        }
        
        .btn-candy:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15), 0 0 0 rgba(0, 0, 0, 0.1) inset;
        }
        
        .btn-pink { background: linear-gradient(135deg, #ff6b9d 0%, #ff4757 100%); color: white; }
        .btn-blue { background: linear-gradient(135deg, #54a0ff 0%, #48dbfb 100%); color: white; }
        .btn-green { background: linear-gradient(135deg, #26de81 0%, #20c997 100%); color: white; }
        .btn-yellow { background: linear-gradient(135deg, #ffa502 0%, #ff9f43 100%); color: white; }
        .btn-purple { background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%); color: white; }
        
        .option-btn {
            min-height: 80px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.4;
            word-wrap: break-word;
            white-space: normal;
        }
        
        .option-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .option-btn.correct {
            animation: correctPulse 0.6s ease-out;
        }
        
        .option-btn.incorrect {
            animation: shake 0.4s ease-out;
        }
        
        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }\n            100% { transform: scale(1); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        
        @keyframes starPop {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) rotate(360deg); opacity: 0; }
        }
        
        .star-popup {
            position: fixed;
            font-size: 40px;
            animation: starPop 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 1000;
        }
        
        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            animation: confettiFall 3s ease-in forwards;
        }
        
        @keyframes confettiFall {
            to {
                transform: translateY(800px) rotateZ(360deg);
                opacity: 0;
            }
        }
        
        .pronunciation-hint {
            background: #f0f4ff;
            padding: 12px;
            border-left: 4px solid #6c5ce7;
            border-radius: 6px;
            font-size: 14px;
            color: #2d3436;
            margin: 12px 0;
            line-height: 1.6;
        }
        
        .scene-tag {
            display: inline-block;
            background: #dfe6e9;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            margin: 4px 4px 4px 0;
            color: #2d3436;
        }
        
        .scene-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin: 4px;
        }
        
        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }
        
        .accordion-item {
            border-bottom: 1px solid #e0e0e0;
            margin: 8px 0;
        }
        
        .accordion-header {
            padding: 14px;
            background: #f8f9fa;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 6px;
            transition: background 0.2s;
        }
        
        .accordion-header:hover {
            background: #ecf0f1;
        }
        
        .accordion-content {
            padding: 12px 14px;
            display: none;
            background: white;
        }
        
        .accordion-content.active {
            display: block;
        }
        
        .sentence-item {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            margin: 8px 0;
            border-left: 4px solid #667eea;
        }
        
        .sentence-text {
            font-size: 16px;
            font-weight: bold;
            margin: 6px 0;
            color: #2d3436;
        }
        
        .sentence-translation {
            font-size: 14px;
            color: #636e72;
            margin: 4px 0;
        }
        
        .sentence-hint {
            font-size: 13px;
            color: #b2bec3;
            margin: 4px 0;
            font-style: italic;
        }
        
        .play-btn-small {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

            transform: scale(0.95);
            background: #5f6ac0;
        }
        
        .score-number {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
        }

            font-size: 20px;
            font-weight: bold;
            color: #2d3436;
            margin: 16px 0;
            animation: slideIn 0.5s ease-out;
        }

            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

        let appState = {
            currentScene: 'all',
            questions: [],
            currentQuestionIndex: 0,
            stars: 0,
            score: 0,
            isAnswered: false,
            mode: 'vi2zh', // 'vi2zh' 看越文選中文, 'zh2vi' 看中文選越南語

        // ============ 音效和發音 ============
        function playSound(type) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (type === 'correct') {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } else if (type === 'incorrect') {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = 300;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            }
        }
 
        function speakVietnamese(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'vi-VN';
                utterance.rate = 0.9;
                utterance.pitch = 1;
                utterance.volume = 1;
                window.speechSynthesis.speak(utterance);
            }
        }
 
        // ============ UI 更新 ============
        function initializeSceneButtons() {
            const sceneButtons = document.getElementById('sceneButtons');
            const scenes = [...new Set(questionBank.map(q => q.scene))];
            
            sceneButtons.innerHTML = '<button id="sceneAllBtn" class="btn-candy btn-purple" data-scene="all">全部隨機 🎲</button>';
            
            scenes.forEach(scene => {
                const btn = document.createElement('button');
                btn.className = 'btn-candy btn-blue text-sm py-2 px-3';
                btn.textContent = scene;
                btn.dataset.scene = scene;
                btn.onclick = () => selectScene(scene);
                sceneButtons.appendChild(btn);
            });
            
            document.getElementById('sceneAllBtn').onclick = () => selectScene('all');
        }
 
        function selectScene(scene) {
            appState.currentScene = scene;
            document.querySelectorAll('#sceneButtons button').forEach(btn => {
                btn.style.opacity = btn.dataset.scene === scene ? '1' : '0.5';
            });
        }
 
        function startQuiz() {
            // 準備 20 題
            let availableQuestions = questionBank;
            if (appState.currentScene !== 'all') {
                availableQuestions = questionBank.filter(q => q.scene === appState.currentScene);
            }
            
            appState.questions = [];
            for (let i = 0; i < 20; i++) {
                const randomQ = availableQuestions[Math.floor(Math.random() * availableQuestions.length)];
                appState.questions.push(randomQ);
            }
            
            appState.sessionQuestions = [...appState.questions];
            appState.currentQuestionIndex = 0;
            appState.stars = 0;
            appState.score = 0;
            appState.isAnswered = false;
            
            // 隨機決定首題的模式
            appState.mode = Math.random() > 0.5 ? 'vi2zh' : 'zh2vi';
            
            showQuizPage();
            displayQuestion();
        }
 
        function showQuizPage() {
            document.getElementById('startPage').classList.add('hidden');
            document.getElementById('quizPage').classList.remove('hidden');
            document.getElementById('resultsPage').classList.add('hidden');
        }
 
        function displayQuestion() {
            if (appState.currentQuestionIndex >= 20) {
                showResults();
                return;
            }
            
            const q = appState.questions[appState.currentQuestionIndex];
            appState.isAnswered = false;
            
            // 隨機切換模式
            if (appState.currentQuestionIndex > 0 && Math.random() > 0.6) {
                appState.mode = appState.mode === 'vi2zh' ? 'zh2vi' : 'vi2zh';
            }
            
            document.getElementById('currentQuestion').textContent = appState.currentQuestionIndex + 1;
            document.getElementById('sceneTag').textContent = q.scene;
            document.getElementById('progressFill').style.width = ((appState.currentQuestionIndex + 1) / 20 * 100) + '%';
            
            // 設定題目文字
            const questionText = appState.mode === 'vi2zh' ? q.vi : q.zh;
            document.getElementById('questionText').textContent = questionText;
            document.getElementById('modeLabel').textContent = appState.mode === 'vi2zh' ? '看越文選中文' : '看中文選越南文';
            document.getElementById('questionMode').textContent = appState.mode === 'vi2zh' ? '看越文選中文 🔄' : '看中文選越南文 🔄';
            
            // 設定音標提示
            if (appState.mode === 'vi2zh') {
                document.getElementById('pronunciationHint').innerHTML = `<strong>發音提示：</strong>${q.hint}`;
                document.getElementById('pronunciationHint').classList.remove('hidden');
            } else {
                document.getElementById('pronunciationHint').classList.add('hidden');
            }
            
            // 準備選項
            const answer = appState.mode === 'vi2zh' ? q.zh : q.vi;
            const wrongAnswers = getWrongAnswers(answer, appState.mode);
            const options = [answer, ...wrongAnswers].sort(() => Math.random() - 0.5);
            
            const optionButtons = document.querySelectorAll('.option-btn');
            optionButtons.forEach((btn, idx) => {
                btn.textContent = options[idx];
                btn.dataset.answer = options[idx];
                btn.dataset.isCorrect = options[idx] === answer;
                btn.classList.remove('correct', 'incorrect', 'disabled');
                btn.onclick = () => selectAnswer(btn);
            });
        }
 
        function getWrongAnswers(correctAnswer, mode) {
            const allAnswers = mode === 'vi2zh' ? questionBank.map(q => q.zh) : questionBank.map(q => q.vi);
            const wrong = allAnswers.filter(a => a !== correctAnswer);
            const selected = [];
            for (let i = 0; i < 3; i++) {
                selected.push(wrong[Math.floor(Math.random() * wrong.length)]);
            }
            return selected;
        }
 
        function selectAnswer(btn) {
            if (appState.isAnswered) return;
            appState.isAnswered = true;
            
            const isCorrect = btn.dataset.isCorrect === 'true';
            const q = appState.questions[appState.currentQuestionIndex];
            
            // 禁用所有選項
            document.querySelectorAll('.option-btn').forEach(b => {
                b.classList.add('disabled');
                if (b.dataset.isCorrect === 'true') {
                    b.classList.add('correct');
                } else if (b === btn && !isCorrect) {
                    b.classList.add('incorrect');
                }
            });
            
            if (isCorrect) {
                appState.score++;
                appState.stars++;
                playSound('correct');
                createStarPopup();
                
                // 顯示鼓勵語
                const encouragements = ['太棒了！', '完美！', '厲害！', '做得好！', '繼續加油！'];
                const msg = encouragements[Math.floor(Math.random() * encouragements.length)];
                showToast(msg, 'success');
            } else {
                playSound('incorrect');
                showToast('答錯了，再看看...', 'error');
            }
            
            setTimeout(() => {
                appState.currentQuestionIndex++;
                displayQuestion();
            }, 1500);
        }
 
        function createStarPopup() {
            const star = document.createElement('div');
            star.className = 'star-popup';
            star.textContent = '⭐';
            star.style.left = Math.random() * window.innerWidth + 'px';
            star.style.top = window.innerHeight / 2 + 'px';
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 800);
            
            document.getElementById('starCount').textContent = appState.stars;
        }

        function showResults() {
            document.getElementById('quizPage').classList.add('hidden');
            document.getElementById('resultsPage').classList.remove('hidden');
            
            document.getElementById('finalScore').textContent = appState.score;
            document.getElementById('finalStars').textContent = appState.stars;
            
            // 鼓勵語
            let encouragement = '';
            if (appState.score === 20) {
                encouragement = '🏆 完美分數！你是越南語高手！';
            } else if (appState.score >= 16) {
                encouragement = '⭐ 太棒了！再練幾次就完全掌握！';
            } else if (appState.score >= 12) {
                encouragement = '👍 不錯！繼續努力加油！';
            } else if (appState.score >= 8) {
                encouragement = '💪 有進步！多練習就會更好！';
            } else {
                encouragement = '🌟 不怕！每一次都在進步！';
            }
            document.getElementById('encouragementMsg').textContent = encouragement;
            
            // 生成複習手冊
            generateHandbook();
            
            // 彩帶特效
            createConfetti();
        }
 
        function generateHandbook() {
            const container = document.getElementById('handbookContainer');
            container.innerHTML = '';
            
            const scenes = [...new Set(appState.sessionQuestions.map(q => q.scene))];
            
            scenes.forEach(scene => {
                const items = appState.sessionQuestions.filter(q => q.scene === scene);
                
                const accordion = document.createElement('div');
                accordion.className = 'accordion-item';
                
                const header = document.createElement('div');
                header.className = 'accordion-header';
                header.innerHTML = `
                    <span><strong>${scene}</strong> (${items.length} 句)</span>
                    <span>▼</span>
                `;
                
                const content = document.createElement('div');
                content.className = 'accordion-content';
                
                items.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'sentence-item';
                    itemDiv.innerHTML = `
                        <div class="sentence-text">${item.vi}</div>
                        <div class="sentence-translation">📌 ${item.zh}</div>
                        <div class="sentence-hint">🎤 ${item.hint}</div>
                        <button class="play-btn-small" onclick="speakVietnamese('${item.vi}')\">🔊 播放發音</button>
                    `;
                    content.appendChild(itemDiv);
                });
                
                header.onclick = () => {
                    content.classList.toggle('active');
                    header.style.background = content.classList.contains('active') ? '#e8eaf6' : '#f8f9fa';
                };
                
                accordion.appendChild(header);
                accordion.appendChild(content);
                container.appendChild(accordion);
            });
        }
 
        function createConfetti() {
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.textContent = ['🎉', '🎊', '⭐', '💫', '🌟'][Math.floor(Math.random() * 5)];
                    confetti.style.left = Math.random() * window.innerWidth + 'px';
                    confetti.style.top = '-30px';
                    confetti.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
        }
 
        // ============ 事件監聽 ============
        document.getElementById('startBtn').addEventListener('click', startQuiz);
        document.getElementById('playBtn').addEventListener('click', () => {
            const q = appState.questions[appState.currentQuestionIndex];
            speakVietnamese(appState.mode === 'vi2zh' ? q.vi : q.zh);
        });
 
        document.getElementById('questionMode').addEventListener('click', () => {
            appState.mode = appState.mode === 'vi2zh' ? 'zh2vi' : 'vi2zh';
            displayQuestion();
        });
 
        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('resultsPage').classList.add('hidden');
            document.getElementById('startPage').classList.remove('hidden');
        });
 
        document.getElementById('reviewBtn').addEventListener('click', () => {
            // 複習模式可以在這裡添加
            document.getElementById('resultsPage').classList.add('hidden');
            document.getElementById('startPage').classList.remove('hidden');
        });
 
        // ============ 初始化 ============
        initializeSceneButtons();
    </script>
</body>
</html>
